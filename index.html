<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>계산 마법사 — 프로토타입</title>
<link rel="stylesheet" href="./src/styles.css?v=1.5.3">
</head><body><div id="wrap">
<header><div><h1>계산 마법사</h1><small>수학으로 주문을 완성하는 2D 액션 RPG · v1.5.3</small></div><div class="stats"><span>기록 <b id="run-time">00:00.00</b></span><span>레벨 <b id="character-level">1</b></span><span>XP <b id="xp-label">0/24</b></span><span>처치 <b id="kills">0</b></span><span>남은 적 <b id="enemies-count">0</b></span></div></header>
<div id="xp-meter" aria-label="다음 레벨 진행도"><div id="xp-progress-fill"></div></div>
<div id="stage"><canvas id="game" width="960" height="600" aria-label="계산 마법사 게임"></canvas><div id="toast" role="status">1 번개 · 2 힐 · WASD 이동</div><div id="slow"></div>
<div id="upgrade-overlay" class="game-overlay" hidden>
  <div class="overlay-panel"><h2 id="upgrade-heading">레벨업</h2><p>업그레이드 하나를 선택하세요. 전투가 정지됩니다.</p><div id="upgrade-options" class="upgrade-options"></div></div>
</div>
<div id="math-cast-hud" class="math-cast-hud" hidden aria-label="오각형 마법진에서 정답 선택">
  <div id="rune-frame" class="rune-frame">
    <svg class="rune-lines" viewBox="0 0 600 520" aria-hidden="true">
      <circle class="rune-outer" cx="300" cy="260" r="201"/>
      <polygon class="rune-pentagon" points="300,62 488,198 416,420 184,420 112,198"/>
      <path class="rune-star" d="M300 62 L416 420 L112 198 L488 198 L184 420 Z"/>
      <circle class="rune-inner" cx="300" cy="260" r="116"/>
    </svg>
    <div class="rune-core">
      <div id="math-title" class="math-hud-title">주문 완성</div>
      <div id="math-problem" class="math-problem"></div>
      <div class="math-hint">정답 1~5 · Esc 취소</div>
    </div>
    <div id="math-answers" class="math-answers"></div>
  </div>
</div>
<div id="victory-overlay" class="game-overlay" hidden>
  <div class="overlay-panel victory-panel"><h2>슬라임 군주 격파!</h2><p>스피드런 클리어 기록</p>
    <strong id="victory-time">00:00.00</strong><p id="victory-stats"></p>
    <button type="button" id="victory-restart">다시 도전</button>
  </div>
</div>
</div>
<div id="buttons">
<button id="bolt" class="skill-button bolt-skill" aria-label="번개 마법"><span class="skill-heading"><span>⚡ 1 · 번개</span><span class="skill-state" id="bolt-state">준비</span></span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="bolt-fill"></span></span></button>
<button id="heal" class="skill-button heal-skill" aria-label="회복 마법"><span class="skill-heading"><span>✚ 2 · 힐</span><span class="skill-state" id="heal-state">준비</span></span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="heal-fill"></span></span></button>
<button id="fireball" class="skill-button fireball-skill" aria-label="파이어볼 마법"><span class="skill-heading"><span>🔥 3 · 파이어볼</span><span class="skill-state" id="fireball-state">준비</span></span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="fireball-fill"></span></span></button>
<button id="cancel">Esc · 취소</button><button id="restart">다시 시작</button><span id="status"></span></div>
<div id="level-picker" class="debug-level-picker" role="group" hidden aria-label="번개 스킬 레벨 체험"><strong>번개 레벨 체험</strong><button type="button" data-bolt-level="1" aria-pressed="true">Lv1 · 1마리 × 20</button><button type="button" data-bolt-level="2" aria-pressed="false">Lv2 · 3마리 × 30</button><button type="button" data-bolt-level="3" aria-pressed="false">Lv3 · 5마리 × 40</button></div>
<div id="heal-level-picker" class="debug-level-picker" role="group" hidden aria-label="힐 스킬 레벨 체험"><strong>힐 레벨 체험</strong><button type="button" data-heal-level="1" aria-pressed="true">Lv1 · +20</button><button type="button" data-heal-level="2" aria-pressed="false">Lv2 · +50</button><button type="button" data-heal-level="3" aria-pressed="false">Lv3 · +80</button></div>

<div id="fireball-level-picker" class="debug-level-picker" role="group" hidden aria-label="파이어볼 스킬 레벨 체험"><strong>파이어볼 레벨 체험</strong><button type="button" data-fireball-level="1">Lv1 · 1항 · 10 피해</button><button type="button" data-fireball-level="2">Lv2 · 2항 · 30 피해</button><button type="button" data-fireball-level="3">Lv3 · 3항 · 70 피해</button></div>
</div>
<script type="module" src="./src/game.js?v=1.5.3"></script></body></html>
