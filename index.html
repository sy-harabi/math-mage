<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아브라칼큘러스!</title>
<link rel="stylesheet" href="./src/styles.css?v=1.9.1">
</head><body><div id="wrap">
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="icon-bolt" viewBox="0 0 48 48"><path d="M28 3 9 27h14l-4 18 21-27H26Z"/></symbol>
  <symbol id="icon-fireball" viewBox="0 0 48 48"><path d="M27 3c3 12-9 11-7 22 5-2 7-5 8-9 11 9 13 15 9 22-5 9-23 9-28-1-5-10 3-20 9-25-1 8 0 11 3 12-2-9 5-12 6-21Z"/></symbol>
  <symbol id="icon-shield" viewBox="0 0 48 48"><path d="m24 4 16 6v12c0 10-7 17-16 22C15 39 8 32 8 22V10Z"/><path class="icon-detail" d="M24 11v25"/></symbol>
  <symbol id="icon-heal" viewBox="0 0 48 48"><path d="M19 6h10v13h13v10H29v13H19V29H6V19h13Z"/></symbol>
  <symbol id="icon-mage" viewBox="0 0 48 48"><path d="m9 26 6-7 7-15 9 17 12 6-18 6-21-4Zm5 7-3 9 13 3 13-3-3-10"/><path class="icon-detail" d="M19 34v3m10-3v3"/></symbol>
</defs></svg>
<header class="game-header">
  <div class="hero-hud"><svg class="mage-portrait" aria-hidden="true"><use href="#icon-mage"/></svg><div class="hero-vitals"><div class="hero-level">Lv. <b id="character-level">1</b><span class="shield-label">방어막 <b id="shield-count">0</b></span></div><div class="health-track" role="meter" id="health-meter" aria-label="체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="health-fill"></div><b id="health-label">100 / 100</b></div></div></div>
  <div class="run-clock"><span>TIME</span><b id="run-time">00:00.00</b></div>
  <div class="game-brand"><h1>아브라칼큘러스!</h1><small>미분하고, 적분하고, 살아남아라.</small></div>
</header>
<div id="stage"><canvas id="game" width="960" height="600" aria-label="아브라칼큘러스! 게임"></canvas><div id="toast" role="status">1 번개 · 2 파이어볼 · 3 보호막 · 4 힐 · WASD 이동</div><div id="slow"></div>
<div id="upgrade-overlay" class="game-overlay" hidden>
  <div class="overlay-panel upgrade-panel"><h2 id="upgrade-heading">레벨업</h2><p>원하는 성장을 선택하세요. 선택 중에는 전투와 기록이 정지됩니다.</p><div id="upgrade-options" class="upgrade-options"></div></div>
</div>
<div id="math-cast-hud" class="math-cast-hud" hidden aria-label="오각형 마법진에서 정답 선택">
  <div id="rune-frame" class="rune-frame">
    <svg class="rune-lines" viewBox="0 0 600 520" aria-hidden="true">
      <circle class="rune-outer" cx="300" cy="260" r="201"/>
      <polygon class="rune-pentagon" points="300,62 488,198 416,420 184,420 112,198"/>
      <path class="rune-star" d="M300 62 L416 420 L112 198 L488 198 L184 420 Z"/>
      <circle class="rune-inner" cx="300" cy="260" r="116"/>
    </svg>
    <div class="rune-core">
      <div id="math-title" class="math-hud-title">주문 완성</div>
      <div id="math-problem" class="math-problem"></div>
      <div class="math-hint">정답 1~5 · Esc 취소</div>
    </div>
    <div id="math-answers" class="math-answers"></div>
  </div>
</div>
<div id="victory-overlay" class="game-overlay" hidden>
  <div class="overlay-panel victory-panel"><h2>슬라임 군주 격파!</h2><p>스피드런 클리어 기록</p>
    <strong id="victory-time">00:00.00</strong><p id="victory-stats"></p>
    <button type="button" id="victory-restart">다시 도전</button>
  </div>
</div>
</div>
<div id="buttons" aria-label="마법 스킬">
<button id="bolt" class="skill-button bolt-skill" aria-label="번개 마법" title="1 · 번개"><kbd>1</kbd><svg class="skill-icon" aria-hidden="true"><use href="#icon-bolt"/></svg><strong>번개</strong><span class="skill-state" id="bolt-state">Lv1 · 준비</span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="bolt-fill"></span></span></button>
<button id="fireball" disabled class="skill-button locked fireball-skill" aria-label="파이어볼 마법" title="2 · 화염구"><kbd>2</kbd><svg class="skill-icon" aria-hidden="true"><use href="#icon-fireball"/></svg><strong>화염구</strong><span class="skill-state" id="fireball-state">미습득</span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="fireball-fill"></span></span></button>
<button id="shield" disabled class="skill-button locked shield-skill" aria-label="보호막 마법" title="3 · 방어막"><kbd>3</kbd><svg class="skill-icon" aria-hidden="true"><use href="#icon-shield"/></svg><strong>방어막</strong><span class="skill-state" id="shield-state">미습득</span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="shield-fill"></span></span></button>
<button id="heal" disabled class="skill-button locked heal-skill" aria-label="회복 마법" title="4 · 힐"><kbd>4</kbd><svg class="skill-icon" aria-hidden="true"><use href="#icon-heal"/></svg><strong>힐</strong><span class="skill-state" id="heal-state">미습득</span><span class="cooldown-track" aria-hidden="true"><span class="cooldown-fill" id="heal-fill"></span></span></button>
</div>
<div class="game-footer"><span id="status"></span><div class="secondary-controls"><button id="cancel">Esc · 취소</button><button id="restart">R · 다시 시작</button></div></div>
<div class="run-stats"><span>처치 <b id="kills">0</b></span><span>남은 적 <b id="enemies-count">0</b></span><span>XP <b id="xp-label">0/12</b></span></div>
<div id="xp-meter" aria-label="다음 레벨 진행도"><div id="xp-progress-fill"></div></div>
<div id="stage-picker" class="debug-level-picker" role="group" hidden aria-label="개발자 스테이지 선택"><strong>스테이지 선택</strong><button type="button" data-debug-stage="1" aria-pressed="true">1단계</button><button type="button" data-debug-stage="2" aria-pressed="false">2단계</button><button type="button" data-debug-stage="3" aria-pressed="false">3단계</button><button type="button" data-debug-stage="4" aria-pressed="false">4단계</button><button type="button" data-debug-stage="5" aria-pressed="false">5단계</button><button type="button" data-debug-stage="6" aria-pressed="false">6단계</button><button type="button" data-debug-stage="7" aria-pressed="false">7단계 · 보스</button><small class="debug-stage-note">스킬·성장 유지 · 체력·쿨타임 회복 · 적·기록 초기화</small></div>
<div id="level-picker" class="debug-level-picker" role="group" hidden aria-label="번개 스킬 레벨 체험"><strong>번개 레벨 체험</strong><button type="button" data-bolt-level="1" aria-pressed="true">Lv1 · 1마리 × 20</button><button type="button" data-bolt-level="2" aria-pressed="false">Lv2 · 3마리 × 30</button><button type="button" data-bolt-level="3" aria-pressed="false">Lv3 · 5마리 × 40</button></div>

<div id="fireball-level-picker" class="debug-level-picker" role="group" hidden aria-label="파이어볼 스킬 레벨 체험"><strong>파이어볼 레벨 체험</strong><button type="button" data-fireball-level="1">Lv1 · 1항 · 10 피해</button><button type="button" data-fireball-level="2">Lv2 · 2항 · 30 피해</button><button type="button" data-fireball-level="3">Lv3 · 3항 · 70 피해</button></div>
<div id="shield-level-picker" class="debug-level-picker" role="group" hidden aria-label="보호막 스킬 레벨 체험"><strong>보호막 레벨 체험</strong><button type="button" data-shield-level="1">Lv1 · 1회 방어</button><button type="button" data-shield-level="2">Lv2 · 2회 방어</button><button type="button" data-shield-level="3">Lv3 · 3회 방어</button></div>
<div id="heal-level-picker" class="debug-level-picker" role="group" hidden aria-label="힐 스킬 레벨 체험"><strong>힐 레벨 체험</strong><button type="button" data-heal-level="1" aria-pressed="true">Lv1 · +20</button><button type="button" data-heal-level="2" aria-pressed="false">Lv2 · +50</button><button type="button" data-heal-level="3" aria-pressed="false">Lv3 · +80</button></div>
</div>
<script type="module" src="./src/game.js?v=1.9.2"></script></body></html>
